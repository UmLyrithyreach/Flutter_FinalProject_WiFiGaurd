name: Sync Upstream

on:
  schedule:
    # Run every 6 hours
    - cron:  '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Add upstream remote
        run: git remote add upstream https://github.com/NiNeatt/Flutter_FinalProject_WiFiGaurd.git
        
      - name: Fetch upstream
        run: git fetch upstream
        
      - name: Sync and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Try to merge upstream main into local main
          git checkout main
          git merge upstream/main --allow-unrelated-histories -m "Auto-sync from upstream"
          
          # Push to origin
          git push origin main
